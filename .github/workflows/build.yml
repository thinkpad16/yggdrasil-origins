# Builds the mod and runs the data checks on every push and pull request.
#
# The checks are the point: checkOrigins reads every origin, path and ability and fails on a
# missing translation, an unknown attribute or a number a description does not match.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-origins
          path: build/libs/*.jar
          if-no-files-found: error
